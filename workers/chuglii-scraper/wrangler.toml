name = "chuglii-scraper"
main = "src/index.js"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
SUPABASE_URL = "https://supabase.chuglii.in"
DEFAULT_PAGES_PER_RUN = "2"

[triggers]
# Runs every 15 minutes automatically to scrape and ingest every new video from the site
crons = ["*/15 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1
